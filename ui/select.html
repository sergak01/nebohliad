<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Nebohliad area</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--scrim); cursor: crosshair; user-select: none; }
      #hint {
        position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
        padding: 8px 14px; background: var(--panel); color: var(--fg); border: 1px solid var(--line);
        font: 14px "Segoe UI", system-ui, sans-serif; pointer-events: none;
      }
      #rect {
        position: fixed; display: none; border: 2px solid var(--accent);
        background: rgba(245, 179, 1, 0.08); box-shadow: 0 0 0 9999px var(--scrim);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="hint" data-i18n="select.hint"></div>
    <div id="rect"></div>
    <script src="i18n.js"></script>
    <script src="select.js"></script>
  </body>
</html>
