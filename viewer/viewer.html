<!doctype html>
<html lang="__LANG__">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Added to the home screen, the page opens without browser bars. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="__APP__" />
    <meta name="theme-color" content="#111318" />
    <link rel="manifest" href="manifest.webmanifest?t=__TOKEN__" />
    <link rel="icon" href="icon.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="viewer.css" />
    <title>__TITLE__</title>
  </head>
  <body>
    <video id="video" playsinline muted autoplay></video>
    <img id="img" alt="" />
    <!-- Keep-awake fallback: a tiny local video that keeps playing. -->
    <video id="awake" playsinline muted></video>
    <div id="status" class="bar"></div>
    <div id="updated" class="bar"></div>
    <div id="controls" class="bar">
      <div class="seg" id="modes">
        <button data-mode="webrtc"></button>
        <button data-mode="mjpeg"></button>
        <button data-mode="snap"></button>
      </div>
      <button id="remote-btn" hidden>
        <!-- A TV remote: body, round pad, two rows of keys. -->
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="7" y="2" width="10" height="20" rx="3" />
          <circle cx="12" cy="8" r="2.2" />
          <path d="M10 13.5h.01M14 13.5h.01M10 17h.01M14 17h.01" />
        </svg>
        <span id="remote-label"></span>
      </button>
      <button id="notify-btn">🔔</button>
      <button id="awake-btn"></button>
      <button id="autofs-btn"></button>
      <button id="fullscreen-btn"></button>
    </div>
    <!-- Notification settings (stored in this browser only). -->
    <div id="notify-panel" class="bar" hidden>
      <div class="panel-title" id="notify-heading"></div>
      <label><input type="checkbox" id="opt-toasts" /> <span id="lbl-toasts"></span></label>
      <label><input type="checkbox" id="opt-browser" /> <span id="lbl-browser"></span></label>
      <div class="hint" id="browser-hint"></div>
      <label><input type="checkbox" id="opt-sound" /> <span id="lbl-sound"></span></label>
      <div class="panel-title" id="kinds-heading"></div>
      <label><input type="checkbox" id="opt-drone" /> <span id="lbl-drone"></span></label>
      <label><input type="checkbox" id="opt-target" /> <span id="lbl-target"></span></label>
      <label><input type="checkbox" id="opt-alert" /> <span id="lbl-alert"></span></label>
      <div class="row"><button id="notify-test"></button><button id="notify-close"></button></div>
    </div>
    <div id="toasts"></div>
    <!-- Remote control (when the app allows it): unlocked with a PIN. -->
    <div id="remote-panel" class="bar" hidden>
      <button id="remote-out">−</button>
      <button id="remote-in">+</button>
      <button id="remote-home">⌂</button>
      <select id="remote-places"></select>
      <button id="remote-lock">✕</button>
      <div class="hint" id="remote-hint"></div>
    </div>
    <div id="remote-pin" class="modal" hidden>
      <form class="modal-box" id="remote-pin-form" role="dialog" aria-modal="true" aria-labelledby="remote-pin-title">
        <h2 id="remote-pin-title"></h2>
        <p id="remote-pin-text"></p>
        <input id="remote-pin-input" type="password" inputmode="numeric" autocomplete="off" maxlength="8" pattern="[0-9]*" />
        <p class="login-error" id="remote-pin-error" hidden></p>
        <div class="row"><button type="button" id="remote-pin-cancel"></button><button type="submit" class="active" id="remote-pin-submit"></button></div>
      </form>
    </div>
    <!-- New page code on the computer: reload (no way to dismiss). -->
    <div id="update" class="modal" hidden>
      <div class="modal-box" role="alertdialog" aria-modal="true" aria-labelledby="update-title">
        <h2 id="update-title"></h2>
        <p id="update-text"></p>
        <button id="update-reload" class="active"></button>
      </div>
    </div>
    <div id="notice" class="bar"></div>
    <script>
      window.NEBOHLIAD = __CONFIG__;
    </script>
    <script src="viewer.js"></script>
  </body>
</html>
